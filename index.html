<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  /* ===================== THEMES ===================== */
  :root{
    --board-bg:#bbada0;
    --cell-bg:#cdc1b4;
    --text-dark:#776e65;
    --text-light:#f9f6f2;
    --body-bg:#faf8ef;
    --ui-bg:#bbada0;
    --btn-bg:#8f7a66;
    --btn-hover:#9f8b76;
    --btn-active:#7f6b58;
    --label-color:#eee4da;
    --instructions-color:#776e65;
  }

  [data-theme="dark"]{
    --board-bg:#2d2d2d;
    --cell-bg:#3d3d3d;
    --text-dark:#e0d9d0;
    --text-light:#f9f6f2;
    --body-bg:#1a1a1a;
    --ui-bg:#3d3d3d;
    --btn-bg:#555;
    --btn-hover:#666;
    --btn-active:#444;
    --label-color:#aaa;
    --instructions-color:#ccc;
  }

  [data-theme="ocean"]{
    --board-bg:#1a5276;
    --cell-bg:#2471a3;
    --text-dark:#d6eaf8;
    --text-light:#ffffff;
    --body-bg:#154360;
    --ui-bg:#1a5276;
    --btn-bg:#117a8b;
    --btn-hover:#138d9b;
    --btn-active:#0e677a;
    --label-color:#aed6f1;
    --instructions-color:#d6eaf8;
  }

  [data-theme="forest"]{
    --board-bg:#1e8449;
    --cell-bg:#27ae60;
    --text-dark:#d5f5e3;
    --text-light:#ffffff;
    --body-bg:#145a32;
    --ui-bg:#1e8449;
    --btn-bg:#196f3d;
    --btn-hover:#1d8348;
    --btn-active:#145a32;
    --label-color:#a9dfbf;
    --instructions-color:#d5f5e3;
  }

  [data-theme="purple"]{
    --board-bg:#6c3483;
    --cell-bg:#8e44ad;
    --text-dark:#e8daef;
    --text-light:#ffffff;
    --body-bg:#4a235a;
    --ui-bg:#6c3483;
    --btn-bg:#7d3c98;
    --btn-hover:#884ea0;
    --btn-active:#6c3483;
    --label-color:#d2b4de;
    --instructions-color:#e8daef;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--body-bg);
    font-family:"Clear Sans","Helvetica Neue",Arial,sans-serif;
    color:var(--text-dark);
    padding:20px;
    touch-action:none;
    user-select:none;
    transition:background 0.3s ease;
  }

  .container{
    width:100%;
    max-width:480px;
  }

  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:16px;
  }

  h1.title{
    font-size:60px;
    font-weight:700;
    margin:0;
    color:var(--text-dark);
    line-height:1;
  }

  .scores{
    display:flex;
    gap:8px;
  }

  .score-box{
    background:var(--ui-bg);
    border-radius:6px;
    padding:10px 20px;
    text-align:center;
    min-width:70px;
    position:relative;
  }

  .score-label{
    font-size:12px;
    font-weight:700;
    color:var(--label-color);
    letter-spacing:0.5px;
  }

  .score-value{
    font-size:22px;
    font-weight:700;
    color:#fff;
  }

  .score-addition{
    position:absolute;
    right:10px;
    top:0;
    font-size:18px;
    font-weight:700;
    color:rgba(119,110,101,0.9);
    animation:scoreFloat 0.6s ease-out forwards;
    pointer-events:none;
  }

  @keyframes scoreFloat{
    0%{ opacity:1; transform:translateY(0); }
    100%{ opacity:0; transform:translateY(-40px); }
  }

  .subheader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:8px;
    flex-wrap:wrap;
  }

  .subtitle{
    font-size:15px;
    line-height:1.4;
    color:var(--text-dark);
  }

  .btn-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .new-game-btn, .undo-btn, .theme-btn, .sound-btn{
    background:var(--btn-bg);
    border:none;
    border-radius:6px;
    color:#f9f6f2;
    font-size:14px;
    font-weight:700;
    padding:10px 14px;
    cursor:pointer;
    transition:background .15s ease;
    white-space:nowrap;
  }

  .new-game-btn:hover, .undo-btn:hover, .theme-btn:hover, .sound-btn:hover{ background:var(--btn-hover); }
  .new-game-btn:active, .undo-btn:active, .theme-btn:active, .sound-btn:active{ background:var(--btn-active); }
  .undo-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .stats-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }

  .stat-item{
    background:var(--ui-bg);
    border-radius:6px;
    padding:6px 12px;
    color:var(--label-color);
    font-size:12px;
    font-weight:700;
  }

  .stat-item span{
    color:#fff;
    font-size:14px;
  }

  .theme-selector{
    display:none;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }

  .theme-selector.open{ display:flex; }

  .theme-pill{
    padding:6px 14px;
    border-radius:20px;
    border:2px solid transparent;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    color:#fff;
    transition:transform 0.15s;
  }

  .theme-pill:hover{ transform:scale(1.08); }
  .theme-pill.active{ border-color:#fff; }
  .theme-pill[data-t="classic"]{ background:#8f7a66; }
  .theme-pill[data-t="dark"]{ background:#444; }
  .theme-pill[data-t="ocean"]{ background:#1a5276; }
  .theme-pill[data-t="forest"]{ background:#1e8449; }
  .theme-pill[data-t="purple"]{ background:#6c3483; }

  .board-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--board-bg);
    border-radius:8px;
    padding:12px;
    transition:background 0.3s ease;
  }

  .grid-bg{
    position:absolute;
    inset:12px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:12px;
  }

  .cell-bg{
    background:var(--cell-bg);
    border-radius:6px;
    transition:background 0.3s ease;
  }

  .tiles-layer{
    position:absolute;
    inset:12px;
  }

  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    font-weight:700;
    background:#eee4da;
    transition:left .1s ease-in-out, top .1s ease-in-out;
  }

  .tile-inner{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    animation:pop-in 0.15s ease;
  }

  @keyframes pop-in{
    0%{ transform:scale(0); }
    80%{ transform:scale(1.1); }
    100%{ transform:scale(1); }
  }

  .v2{ background:#eee4da; color:#776e65; }
  .v4{ background:#ede0c8; color:#776e65; }
  .v8{ background:#f2b179; color:#f9f6f2; }
  .v16{ background:#f59563; color:#f9f6f2; }
  .v32{ background:#f67c5f; color:#f9f6f2; }
  .v64{ background:#f65e3b; color:#f9f6f2; }
  .v128{ background:#edcf72; color:#f9f6f2; }
  .v256{ background:#edcc61; color:#f9f6f2; }
  .v512{ background:#edc850; color:#f9f6f2; }
  .v1024{ background:#edc53f; color:#f9f6f2; }
  .v2048{ background:#edc22e; color:#f9f6f2; box-shadow:0 0 30px 10px rgba(243,215,116,0.6); }
  .v-super{ background:#3c3a32; color:#f9f6f2; box-shadow:0 0 30px 10px rgba(60,58,50,0.5); }

  .instructions{
    margin-top:14px;
    font-size:13px;
    line-height:1.5;
    color:var(--instructions-color);
  }

  .overlay{
    position:absolute;
    inset:0;
    background:rgba(238,228,218,0.73);
    border-radius:8px;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:50;
    animation:fadeIn 0.4s ease;
    padding:20px;
  }

  .overlay.show{ display:flex; }

  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .overlay-title{
    font-size:44px;
    font-weight:700;
    color:var(--text-dark);
    margin-bottom:8px;
  }

  .overlay-score{
    font-size:15px;
    font-weight:600;
    color:var(--text-dark);
    margin-bottom:14px;
    opacity:0.85;
  }

  .overlay.win .overlay-title{ color:#f9f6f2; text-shadow:0 2px 4px rgba(0,0,0,0.2); }
  .overlay.win .overlay-score{ color:#f9f6f2; }
  .overlay.win{ background:rgba(237,194,46,0.5); }

  .overlay-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .overlay-btn{
    background:#8f7a66;
    border:none;
    border-radius:6px;
    color:#f9f6f2;
    font-size:15px;
    font-weight:700;
    padding:10px 20px;
    cursor:pointer;
    transition:background .15s ease;
  }

  .overlay-btn:hover{ background:#9f8b76; }
  .overlay-btn:disabled{ opacity:0.5; cursor:default; }

  .name-input-wrap{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }

  .name-input-wrap.show{ display:flex; }

  .name-input{
    padding:8px 14px;
    font-size:15px;
    border-radius:6px;
    border:2px solid #8f7a66;
    outline:none;
    text-align:center;
    font-family:inherit;
    background:#fff;
    color:#333;
    width:200px;
  }

  .name-label{
    font-size:12px;
    color:var(--instructions-color);
    font-weight:600;
  }

  .leaderboard{
    margin-top:16px;
    background:var(--ui-bg);
    border-radius:8px;
    padding:12px 16px;
  }

  .leaderboard h3{
    margin:0 0 10px 0;
    font-size:14px;
    color:var(--label-color);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .lb-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:13px;
    color:#fff;
  }

  .lb-row:last-child{ border-bottom:none; }
  .lb-rank{ color:var(--label-color); font-weight:700; width:24px; }
  .lb-name{ flex:1; padding:0 8px; }
  .lb-score{ font-weight:700; }
  .lb-empty{ color:var(--label-color); font-size:12px; text-align:center; padding:6px 0; }

  .board-wrap[data-fontscale="lg"] .tile-inner{ font-size:clamp(24px, 8vw, 55px); }
  .board-wrap[data-fontscale="md"] .tile-inner{ font-size:clamp(18px, 6.5vw, 42px); }
  .board-wrap[data-fontscale="sm"] .tile-inner{ font-size:clamp(14px, 5vw, 32px); }

  @media (max-width:400px){
    h1.title{ font-size:44px; }
    .subtitle{ font-size:12px; }
    .new-game-btn, .undo-btn, .theme-btn, .sound-btn{ padding:8px 10px; font-size:12px; }
    .score-box{ padding:8px 14px; min-width:56px; }
    .score-value{ font-size:18px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="scoreValue">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">BEST</div>
        <div class="score-value" id="bestValue">0</div>
      </div>
    </div>
  </div>

  <div class="subheader">
    <div class="subtitle">Join tiles, get to <strong>2048!</strong></div>
    <div class="btn-row">
      <button class="sound-btn" id="soundBtn">ðŸ”Š</button>
      <button class="theme-btn" id="themeBtn">ðŸŽ¨</button>
      <button class="undo-btn" id="undoBtn" disabled>â†© Undo</button>
      <button class="new-game-btn" id="newGameBtn">New Game</button>
    </div>
  </div>

  <div class="theme-selector" id="themeSelector">
    <div class="theme-pill active" data-t="classic">Classic</div>
    <div class="theme-pill" data-t="dark">ðŸŒ™ Dark</div>
    <div class="theme-pill" data-t="ocean">ðŸŒŠ Ocean</div>
    <div class="theme-pill" data-t="forest">ðŸŒ¿ Forest</div>
    <div class="theme-pill" data-t="purple">ðŸ’œ Purple</div>
  </div>

  <div class="stats-row">
    <div class="stat-item">Moves: <span id="moveCount">0</span></div>
    <div class="stat-item">Time: <span id="timerDisplay">00:00</span></div>
  </div>

  <div class="board-wrap" id="boardWrap" data-fontscale="lg">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles-layer" id="tilesLayer"></div>

    <div class="overlay win" id="winOverlay">
      <div class="overlay-title">You Win! ðŸŽ‰</div>
      <div class="overlay-score" id="winScoreMsg"></div>
      <div class="overlay-buttons">
        <button class="overlay-btn" id="keepGoingBtn">Keep Going</button>
        <button class="overlay-btn" id="winTryAgainBtn">New Game</button>
      </div>
    </div>

    <div class="overlay" id="overOverlay">
      <div class="overlay-title">Game Over!</div>
      <div class="overlay-score" id="overScoreMsg"></div>
      <div class="name-input-wrap" id="nameInputWrap">
        <div class="name-label">Enter your name for leaderboard:</div>
        <input class="name-input" id="playerName" type="text" maxlength="16" placeholder="Your name">
      </div>
      <div class="overlay-buttons">
        <button class="overlay-btn" id="saveScoreBtn">ðŸ’¾ Save Score</button>
        <button class="overlay-btn" id="overTryAgainBtn">Try Again</button>
      </div>
    </div>
  </div>

  <div class="instructions">
    <strong>HOW TO PLAY:</strong> Arrow keys / WASD / Swipe to move. Same numbers merge into one!
  </div>

  <div class="leaderboard">
    <h3>ðŸ† Leaderboard (Top 5)</h3>
    <div id="leaderboardList"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SIZE = 4;
  const STORAGE_BEST_KEY  = "game2048_best_score";
  const STORAGE_LB_KEY    = "game2048_leaderboard";
  const STORAGE_THEME_KEY = "game2048_theme";
  const STORAGE_SOUND_KEY = "game2048_sound";

  let board = [], prevBoard = null, prevScore = 0, prevMoves = 0;
  let score = 0, best = 0, moves = 0;
  let hasWon = false, keepGoingAfterWin = false, gameLocked = false;
  let soundOn = true, timerInterval = null, elapsedSeconds = 0;

  const boardWrap       = document.getElementById("boardWrap");
  const gridBg          = document.getElementById("gridBg");
  const tilesLayer      = document.getElementById("tilesLayer");
  const scoreValueEl    = document.getElementById("scoreValue");
  const bestValueEl     = document.getElementById("bestValue");
  const newGameBtn      = document.getElementById("newGameBtn");
  const undoBtn         = document.getElementById("undoBtn");
  const soundBtn        = document.getElementById("soundBtn");
  const themeBtn        = document.getElementById("themeBtn");
  const themeSelector   = document.getElementById("themeSelector");
  const winOverlay      = document.getElementById("winOverlay");
  const overOverlay     = document.getElementById("overOverlay");
  const keepGoingBtn    = document.getElementById("keepGoingBtn");
  const winTryAgainBtn  = document.getElementById("winTryAgainBtn");
  const overTryAgainBtn = document.getElementById("overTryAgainBtn");
  const moveCountEl     = document.getElementById("moveCount");
  const timerEl         = document.getElementById("timerDisplay");
  const winScoreMsg     = document.getElementById("winScoreMsg");
  const overScoreMsg    = document.getElementById("overScoreMsg");
  const nameInputWrap   = document.getElementById("nameInputWrap");
  const playerNameEl    = document.getElementById("playerName");
  const saveScoreBtn    = document.getElementById("saveScoreBtn");
  const lbList          = document.getElementById("leaderboardList");

  /* -- SOUND -- */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function getAudioCtx(){
    if(!audioCtx && AudioCtx) audioCtx = new AudioCtx();
    return audioCtx;
  }

  function playTone(freq, type, duration, vol){
    if(!soundOn) return;
    try{
      const ctx = getAudioCtx(); if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
    } catch(e){}
  }

  function soundMove(){ playTone(220,"sine",0.08,0.1); }
  function soundMerge(){ playTone(440,"triangle",0.12,0.15); }
  function soundWin(){ playTone(660,"sine",0.4,0.2); setTimeout(()=>playTone(880,"sine",0.4,0.2),200); }
  function soundOver(){ playTone(110,"sawtooth",0.5,0.2); }

  soundOn = localStorage.getItem(STORAGE_SOUND_KEY) !== "off";
  soundBtn.textContent = soundOn ? "ðŸ”Š" : "ðŸ”‡";
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "ðŸ”Š" : "ðŸ”‡";
    localStorage.setItem(STORAGE_SOUND_KEY, soundOn ? "on" : "off");
  });

  /* -- THEME -- */
  let currentTheme = localStorage.getItem(STORAGE_THEME_KEY) || "classic";

  function applyTheme(t){
    currentTheme = t;
    document.body.dataset.theme = (t === "classic") ? "" : t;
    localStorage.setItem(STORAGE_THEME_KEY, t);
    document.querySelectorAll(".theme-pill").forEach(p => p.classList.toggle("active", p.dataset.t === t));
  }

  applyTheme(currentTheme);
  themeBtn.addEventListener("click", () => themeSelector.classList.toggle("open"));
  document.querySelectorAll(".theme-pill").forEach(p => {
    p.addEventListener("click", () => { applyTheme(p.dataset.t); themeSelector.classList.remove("open"); });
  });

  /* -- TIMER -- */
  function startTimer(){
    clearInterval(timerInterval); elapsedSeconds = 0; updateTimerDisplay();
    timerInterval = setInterval(() => { elapsedSeconds++; updateTimerDisplay(); }, 1000);
  }
  function stopTimer(){ clearInterval(timerInterval); }
  function updateTimerDisplay(){
    const m = String(Math.floor(elapsedSeconds/60)).padStart(2,"0");
    const s = String(elapsedSeconds%60).padStart(2,"0");
    timerEl.textContent = m + ":" + s;
  }

  /* -- LEADERBOARD -- */
  function loadLeaderboard(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_LB_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveLeaderboard(lb){ localStorage.setItem(STORAGE_LB_KEY, JSON.stringify(lb)); }
  function addToLeaderboard(name, sc){
    const lb = loadLeaderboard();
    lb.push({ name: name || "Anonymous", score: sc, time: timerEl.textContent, moves });
    lb.sort((a,b) => b.score - a.score); lb.splice(5);
    saveLeaderboard(lb); renderLeaderboard();
  }
  function renderLeaderboard(){
    const lb = loadLeaderboard();
    if(lb.length === 0){
      lbList.innerHTML = '<div class="lb-empty">No scores yet. Be the first!</div>'; return;
    }
    const medals = ["ðŸ¥‡","ðŸ¥ˆ","ðŸ¥‰","4ï¸âƒ£","5ï¸âƒ£"];
    lbList.innerHTML = lb.map((e,i) =>
      `<div class="lb-row">
        <div class="lb-rank">${medals[i]}</div>
        <div class="lb-name">${e.name}</div>
        <div class="lb-score">${e.score.toLocaleString()}</div>
      </div>`
    ).join("");
  }

  /* -- GRID -- */
  function buildGridBackground(){
    gridBg.innerHTML = "";
    for(let i=0;i<SIZE*SIZE;i++){
      const c = document.createElement("div"); c.className = "cell-bg"; gridBg.appendChild(c);
    }
  }

  function loadBest(){
    const s = localStorage.getItem(STORAGE_BEST_KEY);
    best = s ? parseInt(s,10)||0 : 0; bestValueEl.textContent = best;
  }
  function saveBest(){ localStorage.setItem(STORAGE_BEST_KEY, String(best)); }

  function emptyBoard(){
    const b=[];
    for(let r=0;r<SIZE;r++) b.push(new Array(SIZE).fill(0));
    return b;
  }

  function cloneBoard(b){ return b.map(row=>[...row]); }

  /* -- NEW GAME -- */
  function startNewGame(){
    board = emptyBoard(); prevBoard = null;
    score = 0; moves = 0;
    hasWon = false; keepGoingAfterWin = false; gameLocked = false;
    tilesLayer.innerHTML = ""; hideOverlays();
    updateScoreDisplay(); moveCountEl.textContent = 0;
    undoBtn.disabled = true;
    nameInputWrap.classList.remove("show");
    playerNameEl.value = "";
    saveScoreBtn.textContent = "ðŸ’¾ Save Score";
    saveScoreBtn.disabled = false;
    spawnRandomTile(); spawnRandomTile(); render(); startTimer();
  }

  /* -- SPAWN -- */
  function getEmptyCells(){
    const cells=[];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) cells.push({r,c});
    return cells;
  }
  function spawnRandomTile(){
    const empties=getEmptyCells(); if(!empties.length) return null;
    const spot=empties[Math.floor(Math.random()*empties.length)];
    board[spot.r][spot.c]=Math.random()<0.9?2:4; return spot;
  }

  /* -- RENDER -- */
  function fontScaleFor(v){ return v>=1000?"sm":v>=100?"md":"lg"; }
  function tileColorClass(v){ return v<=2048?"v"+v:"v-super"; }

  function cellPixelSize(){
    const wr=boardWrap.getBoundingClientRect(), p=12, g=12;
    const inner=wr.width-p*2, cs=(inner-g*(SIZE-1))/SIZE;
    return {cellSize:cs,gap:g};
  }

  function positionForCell(r,c){
    const {cellSize,gap}=cellPixelSize();
    return {left:c*(cellSize+gap),top:r*(cellSize+gap),size:cellSize};
  }

  function render(){
    let maxVal=0;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) maxVal=Math.max(maxVal,board[r][c]);
    boardWrap.dataset.fontscale=fontScaleFor(maxVal);
    tilesLayer.innerHTML="";
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v=board[r][c]; if(!v) continue;
        const pos=positionForCell(r,c);
        const tile=document.createElement("div"); tile.className="tile";
        tile.style.left=pos.left+"px"; tile.style.top=pos.top+"px";
        tile.style.width=pos.size+"px"; tile.style.height=pos.size+"px";
        const inner=document.createElement("div");
        inner.className="tile-inner "+tileColorClass(v); inner.textContent=v;
        tile.appendChild(inner); tilesLayer.appendChild(tile);
      }
    }
  }

  function updateScoreDisplay(prev){
    scoreValueEl.textContent=score;
    if(typeof prev==="number" && score>prev){
      const a=document.createElement("div"); a.className="score-addition";
      a.textContent="+"+(score-prev); scoreValueEl.parentElement.appendChild(a);
      setTimeout(()=>a.remove(),600);
    }
    if(score>best){ best=score; bestValueEl.textContent=best; saveBest(); }
  }

  function hideOverlays(){
    winOverlay.classList.remove("show"); overOverlay.classList.remove("show");
  }

  /* -- MOVE -- */
  function getLine(dir,idx){
    const line=[];
    if(dir==="left")       for(let c=0;c<SIZE;c++)    line.push({r:idx,c,value:board[idx][c]});
    else if(dir==="right") for(let c=SIZE-1;c>=0;c--) line.push({r:idx,c,value:board[idx][c]});
    else if(dir==="up")    for(let r=0;r<SIZE;r++)    line.push({r,c:idx,value:board[r][idx]});
    else if(dir==="down")  for(let r=SIZE-1;r>=0;r--) line.push({r,c:idx,value:board[r][idx]});
    return line;
  }

  function setLine(dir,idx,vals){
    if(dir==="left")       for(let c=0;c<SIZE;c++)    board[idx][c]=vals[c];
    else if(dir==="right") for(let c=0;c<SIZE;c++)    board[idx][SIZE-1-c]=vals[c];
    else if(dir==="up")    for(let r=0;r<SIZE;r++)    board[r][idx]=vals[r];
    else if(dir==="down")  for(let r=0;r<SIZE;r++)    board[SIZE-1-r][idx]=vals[r];
  }

  function processLine(raw){
    const nz=raw.filter(v=>v!==0), res=[];
    let gained=0, i=0;
    while(i<nz.length){
      if(i+1<nz.length && nz[i]===nz[i+1]){ const m=nz[i]*2; res.push(m); gained+=m; i+=2; }
      else { res.push(nz[i]); i++; }
    }
    while(res.length<SIZE) res.push(0);
    let moved=false;
    for(let x=0;x<SIZE;x++) if(res[x]!==raw[x]){moved=true;break;}
    return {result:res,gained,moved};
  }

  function move(dir){
    if(gameLocked) return;
    let anyMoved=false, totalGained=0, didMerge=false;
    const sb=cloneBoard(board), ss=score, sm=moves;

    for(let idx=0;idx<SIZE;idx++){
      const line=getLine(dir,idx), raw=line.map(t=>t.value);
      const {result,gained,moved}=processLine(raw);
      if(moved){ anyMoved=true; totalGained+=gained; if(gained>0)didMerge=true; setLine(dir,idx,result); }
    }
    if(!anyMoved) return;

    prevBoard=sb; prevScore=ss; prevMoves=sm; undoBtn.disabled=false;

    const prevSc=score; score+=totalGained; moves++; moveCountEl.textContent=moves;
    spawnRandomTile(); render(); updateScoreDisplay(prevSc);
    if(didMerge) soundMerge(); else soundMove();
    checkWinCondition(); checkGameOverCondition();
  }

  /* -- UNDO -- */
  undoBtn.addEventListener("click", ()=>{
    if(!prevBoard||gameLocked) return;
    board=cloneBoard(prevBoard); score=prevScore; moves=prevMoves;
    prevBoard=null; moveCountEl.textContent=moves; undoBtn.disabled=true;
    render(); updateScoreDisplay(); hideOverlays(); gameLocked=false;
  });

  /* -- WIN / OVER -- */
  function checkWinCondition(){
    if(hasWon||keepGoingAfterWin) return;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++)
      if(board[r][c]>=2048){
        hasWon=true; gameLocked=true; stopTimer(); soundWin();
        winScoreMsg.textContent=`Score: ${score.toLocaleString()} | Moves: ${moves} | Time: ${timerEl.textContent}`;
        winOverlay.classList.add("show"); return;
      }
  }

  function boardHasEmptyCell(){ return getEmptyCells().length>0; }
  function boardHasAnyMergePossible(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      const v=board[r][c];
      if(c+1<SIZE&&board[r][c+1]===v) return true;
      if(r+1<SIZE&&board[r+1][c]===v) return true;
    }
    return false;
  }

  function checkGameOverCondition(){
    if(boardHasEmptyCell()||boardHasAnyMergePossible()) return;
    gameLocked=true; stopTimer(); soundOver();
    overScoreMsg.textContent=`Score: ${score.toLocaleString()} | Moves: ${moves} | Time: ${timerEl.textContent}`;
    nameInputWrap.classList.add("show"); overOverlay.classList.add("show");
  }

  /* -- BUTTON EVENTS -- */
  newGameBtn.addEventListener("click", startNewGame);
  overTryAgainBtn.addEventListener("click", startNewGame);
  winTryAgainBtn.addEventListener("click", startNewGame);

  keepGoingBtn.addEventListener("click", ()=>{
    keepGoingAfterWin=true; gameLocked=false;
    winOverlay.classList.remove("show"); startTimer();
  });

  saveScoreBtn.addEventListener("click", ()=>{
    const name=playerNameEl.value.trim()||"Anonymous";
    addToLeaderboard(name,score);
    nameInputWrap.classList.remove("show");
    saveScoreBtn.textContent="âœ“ Saved!"; saveScoreBtn.disabled=true;
  });

  /* -- INPUT -- */
  const KEY_DIR = {
    ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
    w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"
  };

  window.addEventListener("keydown",(e)=>{
    const d=KEY_DIR[e.key]; if(!d) return; e.preventDefault(); move(d);
  },{passive:false});

  let touchStartX=0, touchStartY=0, touchTracking=false;
  const SWIPE_THRESHOLD=25;

  boardWrap.addEventListener("touchstart",(e)=>{
    if(e.touches.length!==1) return;
    touchTracking=true; touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
  },{passive:true});

  boardWrap.addEventListener("touchmove",(e)=>{ if(touchTracking) e.preventDefault(); },{passive:false});

  boardWrap.addEventListener("touchend",(e)=>{
    if(!touchTracking) return; touchTracking=false;
    const t=e.changedTouches[0], dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<SWIPE_THRESHOLD) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?"right":"left"); else move(dy>0?"down":"up");
  },{passive:true});

  window.addEventListener("resize",()=>render());

  /* -- BOOT -- */
  buildGridBackground(); loadBest(); renderLeaderboard(); startNewGame();

})();
</script>
</body>
