<style>
  :root, [data-theme="space"]{
    --board-bg: rgba(14, 21, 37, 0.88);

    --text-dark: #e2e8f0;

    --ui-bg: rgba(20, 29, 51, 0.72);
    --btn-bg: rgba(30, 41, 69, 0.8);
    --btn-hover: rgba(45, 60, 98, 0.95);
    --btn-active: #0f172a;
    --label-color: #94a3b8;
    --info-color: #38bdf8;
    --card-shadow: 0 10px 30px rgba(0,0,0,0.6);
    --tile-shadow: 0 4px 16px rgba(0,0,0,0.4);
    --board-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 35px rgba(56, 189, 248, 0.12);
  }
  [data-theme="glass"]{
    --board-bg: rgba(255, 255, 255, 0.12);
    --cell-bg: rgba(255, 255, 255, 0.08);
    --text-dark: #f8fafc;
    --body-bg: radial-gradient(circle at top, #334155 0%, #1e293b 50%, #0f172a 100%);
    --ui-bg: rgba(255, 255, 255, 0.12);
    --btn-bg: rgba(255, 255, 255, 0.18);
    --btn-hover: rgba(255, 255, 255, 0.28);
    --btn-active: rgba(255, 255, 255, 0.1);
    --label-color: #cbd5e1;
    --info-color: #38bdf8;
    --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    --tile-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
    --board-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  [data-theme="classic"]{
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text-dark: #4a4036;
    --body-bg: radial-gradient(circle at top, #fdfbf7 0%, #f4efe6 100%);
    --ui-bg: #bbada0;
    --btn-bg: #8f7a66;
    --btn-hover: #9f8b76;
    --btn-active: #7f6b58;
    --label-color: #eee4da;
    --info-color: #8f7a66;
    --card-shadow: 0 10px 30px rgba(0,0,0,0.08);

  }
  [data-theme="dark"]{
    --board-bg: #23272e;
    --cell-bg: rgba(255,255,255,0.05);
    --text-dark: #f0f6fc;
    --body-bg: radial-gradient(circle at top, #1e2227 0%, #121518 100%);
    --ui-bg: #282c34;
    --btn-bg: #3e4451;
    --btn-hover: #4b5263;

    --card-shadow: 0 10px 30px rgba(0,0,0,0.4);

  [data-theme="ocean"]{
    --board-bg: #133b5c;
    --cell-bg: rgba(255,255,255,0.08);
    --text-dark: #e0f2fe;
    --body-bg: radial-gradient(circle at top, #1a365d 0%, #0c1e33 100%);
    --ui-bg: #1e4976;
    --btn-bg: #0284c7;
    --btn-hover: #0369a1;

    --label-color: #bae6fd;

    --card-shadow: 0 10px 30px rgba(2,132,199,0.2);

  }
  [data-theme="forest"]{
    --board-bg: #1c3b2b;
    --cell-bg: rgba(255,255,255,0.08);
    --text-dark: #ecfdf5;
    --body-bg: radial-gradient(circle at top, #143524 0%, #091a11 100%);
    --ui-bg: #234e38;
    --btn-bg: #10b981;
    --btn-hover: #059669;
    --btn-active: #047857;
    --label-color: #a7f3d0;
    --info-color: #6ee7b7;
    --card-shadow: 0 10px 30px rgba(16,185,129,0.2);

  [data-theme="purple"]{
    --board-bg: #3b185f;
    --cell-bg: rgba(255,255,255,0.08);
    --text-dark: #fae8ff;
    --body-bg: radial-gradient(circle at top, #2f114e 0%, #170729 100%);
    --ui-bg: #4f2280;
    --btn-bg: #a855f7;
    --btn-hover: #9333ea;
    --btn-active: #7e22ce;
    --label-color: #f5d0fe;
    --info-color: #e879f9;
    --card-shadow: 0 10px 30px rgba(168,85,247,0.25);
    --tile-shadow: 0 4px 14px rgba(0,0,0,0.3);

  [data-theme="cyberpunk"]{
    --board-bg: #1a0826;
    --cell-bg: rgba(255,0,128,0.08);
    --text-dark: #00f0ff;

    --ui-bg: #290c3d;
    --btn-bg: #ff007f;
    --btn-hover: #e60073;
    --btn-active: #cc0066;
    --label-color: #00f0ff;
    --info-color: #ff007f;
    --card-shadow: 0 10px 30px rgba(255,0,127,0.3);
    --tile-shadow: 0 0 15px rgba(0,240,255,0.4);
    --board-shadow: 0 0 35px rgba(255,0,128,0.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--body-bg);
    font-family:'Outfit','Plus Jakarta Sans',sans-serif;
    color:var(--text-dark); padding:16px;
    touch-action:pan-y; user-select:none;
    transition:background 0.4s ease, color 0.4s ease;
    position:relative;
  }
  /* Cosmic Dust & Starry Dust Overlay */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: 
      radial-gradient(1.2px 1.2px at 25px 30px, #ffffff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 85px 160px, rgba(255,255,255,0.85), rgba(0,0,0,0)),
      radial-gradient(1px 1px at 190px 70px, rgba(56,189,248,0.9), rgba(0,0,0,0)),
      radial-gradient(2px 2px at 250px 320px, rgba(236,72,153,0.7), rgba(0,0,0,0)),
      radial-gradient(1.2px 1.2px at 340px 210px, #ffffff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 410px 390px, rgba(56,189,248,0.85), rgba(0,0,0,0));
    background-repeat:repeat; background-size:420px 420px;
    opacity:0.45;
  }

  .container{ width:100%; max-width:460px; position:relative; z-index:1; }

  /* ---- HEADER ---- */
  .header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px;
  }
  h1.title{
    font-size:54px; font-weight:900; margin:0;
    background:linear-gradient(135deg, #ffffff 10%, #fbbf24 60%, #f59e0b 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:-1px; line-height:1; filter:drop-shadow(0 2px 12px rgba(251,191,36,0.35));
  }

  .scores{ display:flex; gap:10px; }
  .score-box{
    background:rgba(255,255,255,0.08); border-radius:14px; padding:8px 16px;
    text-align:center; min-width:74px; position:relative;
    box-shadow:var(--card-shadow); border:1px solid rgba(255,255,255,0.16);
    backdrop-filter:blur(10px);
  }
  .score-label{ font-size:10px; font-weight:800; color:var(--label-color); letter-spacing:1px; }
  .score-value{ font-size:20px; font-weight:900; color:#fff; }
  .score-addition{
    position:absolute; right:10px; top:-4px; font-size:16px; font-weight:900;
    color:#00f0ff; animation:scoreFloat 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; pointer-events:none;
    text-shadow:0 0 10px #00f0ff;
  }
  @keyframes scoreFloat{ 0%{opacity:1;transform:translateY(0) scale(1.1);} 100%{opacity:0;transform:translateY(-38px) scale(1.3);} }

  /* ---- TAGLINE ---- */
  .tagline{ font-size:13px; color:var(--info-color); margin-bottom:12px; font-weight:600; }

  /* ---- STATS ---- */
  .stats-row{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .stat-box{
    flex:1; background:rgba(255,255,255,0.07); border-radius:14px;
    padding:8px 12px; text-align:center; box-shadow:var(--card-shadow);
    border:1px solid rgba(255,255,255,0.14); backdrop-filter:blur(8px);
  }
  .stat-label{ font-size:10px; font-weight:800; color:var(--label-color); letter-spacing:0.8px; text-transform:uppercase; }
  .stat-value{ font-size:18px; font-weight:900; color:#fff; margin-top:2px; font-variant-numeric:tabular-nums; }

  /* ---- THEME PILLS (always visible) ---- */
  .theme-row{
    display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;
  }
  .theme-label{ font-size:11px; font-weight:800; color:var(--info-color); align-self:center; margin-right:4px; text-transform:uppercase; letter-spacing:1px; }
  .theme-pill{
    width:32px; height:32px; border-radius:50%; border:3px solid transparent;
    cursor:pointer; transition:transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    position:relative; box-shadow:0 3px 8px rgba(0,0,0,0.25);
  }
  .theme-pill:hover{ transform:scale(1.2); }
  .theme-pill.active{ border-color:#fff; box-shadow:0 0 0 3px rgba(56,189,248,0.5), 0 4px 14px rgba(0,0,0,0.4); }
  .theme-pill[data-t="space"]{
    background:radial-gradient(circle at 35% 35%, #c084fc 0%, #4338ca 45%, #030712 100%);
    box-shadow:0 0 12px rgba(192, 132, 252, 0.75), inset 0 0 5px #fff;
    border:2px solid #a855f7;
  }
  .theme-pill[data-t="glass"]{
    background:rgba(255, 255, 255, 0.22);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:2px solid rgba(255, 255, 255, 0.6);
    box-shadow:0 4px 12px rgba(255, 255, 255, 0.25);
  }
  .theme-pill[data-t="classic"]{ background:linear-gradient(135deg, #bbada0, #8f7a66); }
  .theme-pill[data-t="dark"]{ background:linear-gradient(135deg, #3e4451, #1e2227); }
  .theme-pill[data-t="ocean"]{ background:linear-gradient(135deg, #0284c7, #133b5c); }
  .theme-pill[data-t="forest"]{ background:linear-gradient(135deg, #10b981, #143524); }
  .theme-pill[data-t="purple"]{ background:linear-gradient(135deg, #a855f7, #3b185f); }
  .theme-pill[data-t="cyberpunk"]{ background:linear-gradient(135deg, #ff007f, #00f0ff); }
  .theme-pill::after{
    content:attr(title); position:absolute; bottom:-28px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.85); color:#fff; font-size:10px; font-weight:700; padding:3px 8px;
    border-radius:6px; white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity 0.2s; backdrop-filter:blur(4px); z-index:10;
  }
  .theme-pill:hover::after{ opacity:1; }

  /* ---- MODE PILLS WITH SOFT NEON OUTLINES ---- */
  .mode-row{ display:flex; gap:8px; margin-bottom:14px; }
  .mode-btn{
    flex:1; padding:10px 8px; border-radius:999px; background:rgba(255,255,255,0.06);
    color:var(--label-color); font-size:12px; font-weight:800; cursor:pointer;
    transition:all .2s ease; text-align:center;
    border:1.5px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(8px); font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .mode-btn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,0.35); }
  .mode-btn.active{
    background:rgba(255,255,255,0.12); color:#fff;
    border-color:#38bdf8;
    box-shadow:0 0 14px rgba(56, 189, 248, 0.5);
  }
  .mode-btn[data-mode="space"].active{
    border-color:#ec4899;
    box-shadow:0 0 16px rgba(236, 72, 153, 0.55);
  }
  .mode-btn[data-mode="blitz"].active{
    border-color:#fb923c;
    box-shadow:0 0 16px rgba(251, 146, 60, 0.55);
  }

  /* ---- UNIFORM SEMI-TRANSLUCENT SQUARE ACTION BUTTONS ---- */
  .action-row{
    display:flex; gap:10px; margin-bottom:14px; justify-content:space-between;
  }
  .icon-btn{
    flex:1; height:50px; background:rgba(255,255,255,0.08); border-radius:14px;
    color:#fff; font-size:22px; font-family:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:transform .18s cubic-bezier(0.34, 1.56, 0.64, 1), background .2s, box-shadow .2s;
    box-shadow:0 4px 14px rgba(0,0,0,0.2); border:1.5px solid rgba(255,255,255,0.15);
    position:relative; backdrop-filter:blur(8px);
  }
  .icon-btn:hover{
    background:rgba(255,255,255,0.16); transform:translateY(-2px);
    box-shadow:0 0 16px rgba(255,255,255,0.25);
  }
  .icon-btn:active{ transform:scale(0.94); }
  .icon-btn:disabled{ opacity:0.3; cursor:not-allowed; transform:none; }
  .icon-btn.share-icon{
    background:rgba(255, 107, 107, 0.16);
    border-color:rgba(255, 107, 107, 0.45);
    box-shadow:0 0 16px rgba(255, 107, 107, 0.35);
  }
  .icon-btn.share-icon:hover{
    background:rgba(255, 107, 107, 0.28);
    box-shadow:0 0 22px rgba(255, 107, 107, 0.65);
  }
  .icon-btn[data-tip]::after{
    content:attr(data-tip); position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.85); color:#fff; font-size:10px; font-weight:800; padding:3px 8px;
    border-radius:6px; white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity 0.2s, transform 0.2s; z-index:100; backdrop-filter:blur(4px);
  }
  .icon-btn:hover[data-tip]::after{ opacity:1; transform:translateX(-50%) translateY(2px); }

  /* ---- POWER-UP ACTION PILLS WITH BRIGHT CYAN FLOATING COUNTER BADGES ---- */
  .boost-row{ display:flex; gap:12px; margin-bottom:14px; }
  .boost-btn{
    flex:1; height:46px; background:rgba(255,255,255,0.07);
    border:1.5px solid rgba(0, 240, 255, 0.35); border-radius:999px;
    color:#fff; font-size:14px; font-weight:800; padding:0 16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s, background .15s, box-shadow .15s;
    box-shadow:0 0 12px rgba(0, 240, 255, 0.18); font-family:inherit; position:relative;
    backdrop-filter:blur(10px);
  }
  .boost-btn:hover{
    background:rgba(0, 240, 255, 0.14); transform:translateY(-2px);
    box-shadow:0 0 20px rgba(0, 240, 255, 0.45);
    border-color:#00f0ff;
  }
  .boost-btn:active{ transform:scale(0.96); }
  .boost-btn.active{ background:#e74c3c; animation:pulse 0.8s infinite alternate; }
  @keyframes pulse{ from{box-shadow:0 0 6px #e74c3c;} to{box-shadow:0 0 20px #e74c3c;} }
  .boost-badge{
    background:#00f0ff; color:#030712; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:900;
    box-shadow:0 0 12px #00f0ff, inset 0 1px 2px rgba(255,255,255,0.8);
  }
  .boost-btn[data-tip]::after{
    content:attr(data-tip); position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.85); color:#fff; font-size:10px; font-weight:800; padding:3px 8px;
    border-radius:6px; white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity 0.2s, transform 0.2s; z-index:100; backdrop-filter:blur(4px);
  }
  .boost-btn:hover[data-tip]::after{ opacity:1; transform:translateX(-50%) translateY(2px); }

  /* Hammer selection target */
  .tile.hammer-target{ cursor:crosshair; animation:shake 0.3s infinite; }
  @keyframes shake{ 0%{transform:rotate(0deg);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);} 100%{transform:rotate(0deg);} }

  /* Floating Toast Feedback on Icon Tap */
  .toast-msg{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:rgba(0,0,0,0.88); color:#fff; padding:10px 20px; border-radius:20px;
    font-size:13px; font-weight:800; z-index:9999; opacity:0; pointer-events:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2);
    transition:transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s;
    backdrop-filter:blur(8px);
  }
  .toast-msg.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- BOARD ---- */
  .board-wrap{
    position:relative; width:100%; aspect-ratio:1/1;
    background:var(--board-bg); border-radius:22px; padding:12px;
    transition:background 0.3s; box-shadow:var(--board-shadow);
    border:1.5px solid rgba(255,255,255,0.15);
    touch-action:none; -webkit-user-select:none;
    backdrop-filter:blur(10px);
  }
  .grid-bg{
    position:absolute; inset:12px; display:grid;
    grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:12px;
  }
  .cell-bg{
    background:var(--cell-bg); border-radius:14px; transition:background 0.3s;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.15);
  }
  .tiles-layer{ position:absolute; inset:12px; }

  .tile{
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:14px; font-weight:800;
    transition:left .12s cubic-bezier(0.25, 1, 0.5, 1), top .12s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .tile-inner{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    border-radius:14px; animation:pop-in 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

      if (globalBestRef) {
        globalBestRef.transaction(currentBest => {
          if (currentBest === null || newScore > currentBest) {
            return newScore;
          }
          return currentBest; // Abort if another player scored higher in the meantime
        }).catch(err => {
          console.warn("Firebase transaction update notice:", err);
        });
      }
    }
  }

  /* ------ SOUND ------ */
  let actx=null;
  function getCtx(){
    if(!actx){ try{ actx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    return actx;
  }
  function beep(freq,type,dur,vol){
    if(!soundOn) return;
    try{
      const c=getCtx(); if(!c) return;
      const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(vol,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.start(); o.stop(c.currentTime+dur);
    }catch(e){}
  }
  const sndMove  = ()=>beep(200,"sine",0.07,0.1);
  const sndMerge = ()=>beep(420,"triangle",0.1,0.15);
  const sndWin   = ()=>{ beep(660,"sine",0.3,0.2); setTimeout(()=>beep(880,"sine",0.3,0.2),200); };
  const sndOver  = ()=>beep(100,"sawtooth",0.4,0.2);

  soundOn = localStorage.getItem(K_SOUND) !== "off";
  let toastTimer = null;
  function showToast(msg){
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 1800);
  }

  function updateSoundUI(){
    if(soundIcon) soundIcon.textContent = soundOn ? "\uD83D\uDD0A" : "\uD83D\uDD07";
  }
  updateSoundUI();
  soundBtn.addEventListener("click",()=>{
    soundOn=!soundOn;
    localStorage.setItem(K_SOUND,soundOn?"on":"off");
    updateSoundUI();
    showToast(soundOn ? "Sound: ON 🔊" : "Sound: Muted 🔇");
  });

  /* ------ THEME SWITCHER (STARGAZER, AQUA, ARCTIC) ------ */
  const themeBtns = document.querySelectorAll(".theme-toggle-btn");
  function applyTheme(t){
    if (window.ThemeEngine && window.ThemeEngine.switchTheme) {
      window.ThemeEngine.switchTheme(t);
    } else {
      document.body.setAttribute("data-animated-theme", t);
      localStorage.setItem("g1024_active_theme", t);
    }
    themeBtns.forEach(btn => btn.classList.toggle("active", btn.dataset.theme === t));
  }
  themeBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.theme;
      applyTheme(t);
      if (t === "stargazer") showToast("🌌 Stargazer Theme Activated");
      else if (t === "aqua") showToast("🌊 Aqua Drift Theme Activated");
      else if (t === "arctic") showToast("❄️ Arctic Drift Theme Activated");
    });
  });

  /* ------ GAME MODES & BOOSTERS STATE ------ */
  let gameMode = "classic"; // "classic", "blitz", "daily"
  let blitzTime = 60;
  let hammerActive = false;
  let hammerCount = 2;
  let shuffleCount = 1;

  // Daily challenge pseudo-random seed
  function getDailySeed(){
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  let dailyRand = getDailySeed();
  function dailyRandom(){
    dailyRand = (dailyRand * 9301 + 49297) % 233280;
    return dailyRand / 233280;
  }

  /* ------ TIMER ------ */
  function startTimer(){
    clearInterval(timerInt); elapsed=0; timerStarted=false;
    if(gameMode === "blitz"){
      blitzTime = 60;
      timerEl.textContent = "01:00";
    } else {
      timerEl.textContent = "00:00";
    }
  }
  function startTimerOnFirstMove(){
    if(timerStarted) return;
    timerStarted=true;
    if(gameMode === "blitz"){
      timerInt=setInterval(()=>{
        blitzTime--;
        const m=String(Math.floor(blitzTime/60)).padStart(2,"0");
        const s=String(blitzTime%60).padStart(2,"0");
        timerEl.textContent=m+":"+s;
        if(blitzTime <= 0){
          clearInterval(timerInt);
          locked=true; sndOver();
          overInfo.textContent="⏱️ Time Up! Score: "+score.toLocaleString()+" | Moves: "+moves;
          overOverlay.classList.add("show");
        }
      },1000);
    } else {
      timerInt=setInterval(()=>{
        elapsed++;
        const m=String(Math.floor(elapsed/60)).padStart(2,"0");
        const s=String(elapsed%60).padStart(2,"0");
        timerEl.textContent=m+":"+s;
      },1000);
    }
  }
  function stopTimer(){ clearInterval(timerInt); }
  // ---- THUNDER FLASH ----
  function flashThunder(){
    const el=document.createElement('div');
    el.className='thunder';
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); }, 350);
  }

  /* ------ LEADERBOARD ------ */
  function loadLB(){ try{ return JSON.parse(localStorage.getItem(K_LB))||[]; }catch(e){ return[]; } }
  function saveLB(lb){ localStorage.setItem(K_LB,JSON.stringify(lb)); }
  function addLB(name,sc){
    const lb=loadLB();
    lb.push({name:name||"Anonymous",score:sc,moves:moveEl.textContent||0,time:timerEl.textContent});
    lb.sort((a,b)=>b.score-a.score); lb.splice(5); saveLB(lb); renderLB(); flashThunder();
  }
  function renderLB(){
    const lb=loadLB();
    if(!lb.length){ lbList.innerHTML='<div class="lb-empty">No scores yet — be the first!</div>'; return; }
    const ranks=["1st","2nd","3rd","4th","5th"];
    lbList.innerHTML=lb.map((e,i)=>`
      <div class="lb-row">
        <div class="lb-rank">${ranks[i]}</div>
        <div class="lb-name">${e.name}</div>
        <div class="lb-score">${e.score.toLocaleString()}</div>
        <div class="lb-moves">${e.moves}mv</div>
      </div>`).join("");
  }

  /* ------ BOARD ------ */
  function buildGrid(){
    gridBg.innerHTML="";
    for(let i=0;i<SIZE*SIZE;i++){ const c=document.createElement("div"); c.className="cell-bg"; gridBg.appendChild(c); }
  }
  function loadBest(){ best=parseInt(localStorage.getItem(K_BEST)||"0",10)||0; bestEl.textContent=best.toLocaleString(); }
  function saveBest(){ localStorage.setItem(K_BEST,String(best)); }
  function emptyB(){ return Array.from({length:SIZE},()=>new Array(SIZE).fill(0)); }
  function cloneB(b){ return b.map(r=>[...r]); }

  /* ------ NEW GAME ------ */
  function newGame(){
    board=emptyB(); prevBoard=null; score=0; moves=0;
    hasWon=false; keepGoing=false; locked=false;
    hammerActive=false;
    hammerCount=2;
    shuffleCount=1;
    if(hammerBtn){
      hammerBtn.classList.remove("active");
      hammerBtn.disabled=false;
    }
    if(shuffleBtn){
      shuffleBtn.disabled=false;
    }
    if(hammerCountEl) hammerCountEl.textContent="x"+hammerCount;
    if(shuffleCountEl) shuffleCountEl.textContent="x"+shuffleCount;
    if(gameMode === "daily"){
      dailyRand = getDailySeed(); // reset daily sequence
    }
    tilesLayer.innerHTML=""; hideOverlays();
    updateScore(); moveEl.textContent="0"; undoBtn.disabled=true;
    nameRow.style.display=""; nameEl.value="";
    saveBtn.textContent="Save Score"; saveBtn.disabled=false;
    spawn(); spawn(); render();
    startTimer(); // resets timer
  }

  /* ------ SPAWN ------ */
  function emptyCells(){ const c=[]; for(let r=0;r<SIZE;r++) for(let c2=0;c2<SIZE;c2++) if(!board[r][c2]) c.push({r,c:c2}); return c; }
  function spawn(){
    const e=emptyCells(); if(!e.length) return;
    const rnd = (gameMode === "daily") ? dailyRandom() : Math.random();
    const s = e[Math.floor(rnd * e.length)];
    const valRnd = (gameMode === "daily") ? dailyRandom() : Math.random();
    board[s.r][s.c] = valRnd < 0.9 ? 1 : 2;
  }

  /* ------ RENDER ------ */
  function fscale(v){ return v>=1000?"sm":v>=100?"md":"lg"; }
  function cls(v){ return v<=1024?"v"+v:"v-super"; }
  function cellPos(r,c){
    const wr=boardWrap.getBoundingClientRect(), p=10, g=10;
    const inner=wr.width-p*2, cs=(inner-g*(SIZE-1))/SIZE;
    return {left:c*(cs+g),top:r*(cs+g),size:cs};
  }
  function render(){
    let mx=0; for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) mx=Math.max(mx,board[r][c]);
    boardWrap.dataset.fontscale=fscale(mx); tilesLayer.innerHTML="";
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      const v=board[r][c]; if(!v) continue;
      const p=cellPos(r,c), t=document.createElement("div");
      t.className="tile" + (hammerActive ? " hammer-target" : "");
      t.style.cssText=`left:${p.left}px;top:${p.top}px;width:${p.size}px;height:${p.size}px`;
      const inn=document.createElement("div"); inn.className="tile-inner "+cls(v); inn.textContent=v;
      t.appendChild(inn);
      
      // Hammer click action to destroy single tile
      t.addEventListener("click",()=>{
        if(!hammerActive) return;
        board[r][c] = 0;
        hammerActive = false;
        hammerBtn.classList.remove("active");
        hammerCount--;
        hammerCountEl.textContent = "x" + hammerCount;
        if(hammerCount <= 0) hammerBtn.disabled = true;
        flashThunder();
        beep(150, "square", 0.1, 0.2);
        showToast("Tile smashed! 💥");
        render();
      });

      tilesLayer.appendChild(t);
    }
  }
  function updateScore(prev){
    scoreEl.textContent=score.toLocaleString();
    if(typeof prev==="number"&&score>prev){ const a=document.createElement("div"); a.className="score-addition"; a.textContent="+"+(score-prev).toLocaleString(); scoreEl.parentElement.appendChild(a); setTimeout(()=>a.remove(),600); }
    updateGlobalBestIfHigher(score);
  }
  function hideOverlays(){ winOverlay.classList.remove("show"); overOverlay.classList.remove("show"); }

  /* ------ MOVE ------ */
  function getLine(dir,idx){
    const l=[];
    if(dir==="left")       for(let c=0;c<SIZE;c++)    l.push(board[idx][c]);
    else if(dir==="right") for(let c=SIZE-1;c>=0;c--) l.push(board[idx][c]);
    else if(dir==="up")    for(let r=0;r<SIZE;r++)    l.push(board[r][idx]);
    else                   for(let r=SIZE-1;r>=0;r--) l.push(board[r][idx]);
    return l;
  }
  function setLine(dir,idx,vals){
    if(dir==="left")       for(let c=0;c<SIZE;c++)    board[idx][c]        =vals[c];
    else if(dir==="right") for(let c=0;c<SIZE;c++)    board[idx][SIZE-1-c] =vals[c];
    else if(dir==="up")    for(let r=0;r<SIZE;r++)    board[r][idx]        =vals[r];
    else                   for(let r=0;r<SIZE;r++)    board[SIZE-1-r][idx] =vals[r];
  }
  function procLine(raw){
    const nz=raw.filter(v=>v!==0), res=[]; let gained=0, i=0;
    while(i<nz.length){
      if(i+1<nz.length&&nz[i]===nz[i+1]){ const m=nz[i]*2; res.push(m); gained+=m; i+=2; }
      else{ res.push(nz[i]); i++; }
    }
    while(res.length<SIZE) res.push(0);
    return {result:res, gained, moved:res.some((v,i)=>v!==raw[i])};
  }
  function move(dir){
    if(locked) return;
    let anyMoved=false, totalGained=0, merged=false;
    const sb=cloneB(board), ss=score, sm=moves;
    for(let idx=0;idx<SIZE;idx++){
      const {result,gained,moved}=procLine(getLine(dir,idx));
      if(moved){ anyMoved=true; totalGained+=gained; if(gained) merged=true; setLine(dir,idx,result); }
    }
    if(!anyMoved) return;
    startTimerOnFirstMove(); // timer starts only on first move
    prevBoard=sb; prevScore=ss; prevMoves=sm; undoBtn.disabled=false;
    const ps=score; score+=totalGained; moves++; moveEl.textContent=moves;
    spawn(); render(); updateScore(ps);
    if(merged){
      sndMerge();
      if(window.ThemeEngine && window.ThemeEngine.spawnShockwave){
        const wr = boardWrap.getBoundingClientRect();
        window.ThemeEngine.spawnShockwave(wr.left + wr.width / 2, wr.top + wr.height / 2, true);
      }
    } else {
      sndMove();
    }
    checkWin(); checkOver();
  }

  /* ------ UNDO ------ */
  undoBtn.addEventListener("click",()=>{
    if(!prevBoard||locked) return;
    board=cloneB(prevBoard); score=prevScore; moves=prevMoves;
    prevBoard=null; moveEl.textContent=moves; undoBtn.disabled=true;
    render(); updateScore(); hideOverlays(); locked=false;
    showToast("Move undone ↩");
  });

  /* ------ WIN / OVER ------ */
  function checkWin(){
    if(hasWon||keepGoing) return;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]>=1024){
      hasWon=true; locked=true; stopTimer(); sndWin();
      winInfo.textContent="Score: "+score.toLocaleString()+"  |  Moves: "+moves+"  |  Time: "+timerEl.textContent;
      winOverlay.classList.add("show"); return;
    }
  }
  function canMerge(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      const v=board[r][c];
      if(c+1<SIZE&&board[r][c+1]===v) return true;
      if(r+1<SIZE&&board[r+1][c]===v) return true;
    }
    return false;
  }
  function checkOver(){
    if(emptyCells().length||canMerge()) return;
    locked=true; stopTimer(); sndOver();
    overInfo.textContent="Score: "+score.toLocaleString()+"  |  Moves: "+moves+"  |  Time: "+timerEl.textContent;
    overOverlay.classList.add("show");
  }

  /* ------ BUTTON EVENTS ------ */
  newBtn.addEventListener("click",()=>{
    newGame();
    showToast("New Game Started! ▶");
  });
  overNewBtn.addEventListener("click",newGame);
  winNewBtn.addEventListener("click",newGame);
  keepGoingBtn.addEventListener("click",()=>{
    keepGoing=true; locked=false;
    winOverlay.classList.remove("show");
    timerStarted=false;
    startTimerOnFirstMove(); // resume timer immediately when keeping going
  });
  saveBtn.addEventListener("click",()=>{
    addLB(nameEl.value.trim(),score);
    nameRow.style.display="none"; saveBtn.textContent="Saved!"; saveBtn.disabled=true;
  });

  function shareScore(statusText){
    const shareUrl = window.location.origin + window.location.pathname;
    const text = `🔥 ${statusText} in 1024 Puzzle Game!\nScore: ${score.toLocaleString()} | Moves: ${moves} | Time: ${timerEl.textContent}\nCan you beat my record? Play here: ${shareUrl}`;
    showToast("Sharing challenge link... 🔥");
    if(navigator.share){
      navigator.share({ title:"1024 Puzzle Challenge", text:text, url:shareUrl }).catch(()=>{});
    }else{
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(waUrl, "_blank");
    }
  }
  /* ------ FIRE HUB MODAL (Add to Home & Share) ------ */
  function openFireModal(){
    if(!fireModalOverlay) return;
    fireModalOverlay.classList.add("show");
  }
  function hideFireModal(){
    if(!fireModalOverlay) return;
    fireModalOverlay.classList.remove("show");
  }
  if(topShareBtn) topShareBtn.addEventListener("click", openFireModal);
  if(closeFireModal) closeFireModal.addEventListener("click", hideFireModal);
  if(fireModalOverlay){
    fireModalOverlay.addEventListener("click", e => {
      if(e.target === fireModalOverlay) hideFireModal();
    });
  }
  window.addEventListener("keydown", e => {
    if(e.key === "Escape" && fireModalOverlay && fireModalOverlay.classList.contains("show")){
      hideFireModal();
    }
  });

  if(fireInstallBtn){
    fireInstallBtn.addEventListener("click", async () => {
      hideFireModal();
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (isStandalone) {
        showToast("Already installed on your device! 📲✅");
        return;
      }
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          showToast("Installing 1024 App... 📲✨");
        }
        deferredPrompt = null;
      } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
        showToast("iOS: Tap Share ⬆️ and select 'Add to Home Screen' 📲");
      } else {
        showToast("Tap browser menu (⋮) -> 'Add to Home screen' 📲");
      }
    });
  }

  if(fireShareBtn){
    fireShareBtn.addEventListener("click", () => {
      hideFireModal();
      shareScore(score > 0 ? `I have ${score.toLocaleString()} points` : "Check out this puzzle");
    });
  }

  if(fireCopyBtn){
    fireCopyBtn.addEventListener("click", () => {
      hideFireModal();
      const shareUrl = window.location.origin + window.location.pathname;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast("Game link copied! 📋");
        }).catch(() => {
          showToast("Game link: " + shareUrl);
        });
      } else {
        showToast("Game link: " + shareUrl);
      }
    });
  }

  if(winShareBtn) winShareBtn.addEventListener("click", openFireModal);
  if(overShareBtn) overShareBtn.addEventListener("click", openFireModal);

  /* ------ POWER-UPS & MODES LISTENERS ------ */

  hammerBtn.addEventListener("click",()=>{
    if(hammerCount <= 0 || locked) return;
    hammerActive = !hammerActive;
    hammerBtn.classList.toggle("active", hammerActive);
    if(hammerActive){
      showToast("Tap any tile to smash! 🔨");
    } else {
      showToast("Hammer cancelled");
    }
    render();
  });

  shuffleBtn.addEventListener("click",()=>{
    if(shuffleCount <= 0 || locked) return;
    const vals = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]) vals.push(board[r][c]);
    if(vals.length <= 1) return;
    // Fisher-Yates shuffle
    for(let i=vals.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [vals[i], vals[j]] = [vals[j], vals[i]];
    }
    let idx = 0;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]) board[r][c] = vals[idx++];
    shuffleCount--;
    shuffleCountEl.textContent = "x" + shuffleCount;
    if(shuffleCount <= 0) shuffleBtn.disabled = true;
    flashThunder();
    sndMerge();
    showToast("Board Shuffled! 🔀");
    render();
  });

  function setGameMode(m){
    gameMode = m;
    [modeClassic, modeBlitz, modeSpace, modeDaily].forEach(b=>{
      if(b) b.classList.toggle("active", b.dataset.mode===m);
    });
    if(m === "space"){
      applyTheme("space");
      showToast("🚀 Space Explorer Mode Active!");
    }
    newGame();
  }
  if(modeClassic) modeClassic.addEventListener("click",()=>setGameMode("classic"));
  if(modeBlitz) modeBlitz.addEventListener("click",()=>setGameMode("blitz"));
  if(modeSpace) modeSpace.addEventListener("click",()=>setGameMode("space"));
  if(modeDaily) modeDaily.addEventListener("click",()=>setGameMode("daily"));

  /* ------ PWA SERVICE WORKER & INSTALL PROMPT ------ */
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  /* ------ KEYBOARD ------ */
  const KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
  window.addEventListener("keydown",e=>{ const d=KEYS[e.key]; if(!d) return; e.preventDefault(); move(d); },{passive:false});

  /* ------ TOUCH / SWIPE (Smooth on-board only) ------ */
  let startX = 0, startY = 0, isTouching = false;
  const MIN_SWIPE_DIST = 20;

  boardWrap.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    isTouching = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  boardWrap.addEventListener("touchmove", e => {
    if(!isTouching) return;
    // Prevent screen scroll ONLY while actively swiping inside the game board
    e.preventDefault();
  }, { passive: false });

  boardWrap.addEventListener("touchend", e => {
    if(!isTouching) return;
    isTouching = false;
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - startX;
    const dy = endY - startY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if(Math.max(absDx, absDy) >= MIN_SWIPE_DIST){
      if(absDx > absDy){
        move(dx > 0 ? "right" : "left");
      } else {
        move(dy > 0 ? "down" : "up");
      }
    }
  }, { passive: true });

  boardWrap.addEventListener("touchcancel", () => {
    isTouching = false;
  }, { passive: true });

  window.addEventListener("resize",render);

  /* ------ BOOT ------ */
  buildGrid(); loadBest(); initGlobalBestListener(); renderLB(); newGame();
})();
</script>
<script src="theme-engine.js"></script>
<script>
  // Initialize High-Performance Canvas Theme Engine
  if (window.ThemeEngine) {
    window.ThemeEngine.init('bg-canvas');
  }
</script>
